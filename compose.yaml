services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: liars_dice
      POSTGRES_USER: liars_dice
      POSTGRES_PASSWORD: liars_dice
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liars_dice -d liars_dice"]
      interval: 2s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres:
